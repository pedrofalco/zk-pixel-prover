[build]
  command = "npm run build"
  publish = ".netlify"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = [
    "node_modules/@aztec/bb.js/dest/node/barretenberg_wasm/barretenberg-threads.wasm.gz",
    "node_modules/@noir-lang/noirc_abi/nodejs/**",
    "node_modules/@noir-lang/acvm_js/nodejs/**"
  ]

